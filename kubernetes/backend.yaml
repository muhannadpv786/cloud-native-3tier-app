apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: muhannad-app
type: Opaque
stringData:
  DB_PASSWORD: root123

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: muhannad-app
spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
      - name: backend
        image: muhannadpv/backend:latest
        imagePullPolicy: Always

        ports:
        - containerPort: 3001

        env:
        - name: DB_HOST
          value: mysql

        - name: DB_USER
          value: root

        - name: DB_NAME
          value: efootball

        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: DB_PASSWORD

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: muhannad-app
spec:
  selector:
    app: backend

  ports:
  - port: 3001
    targetPort: 3001

  type: ClusterIP
